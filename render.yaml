services:
  - type: web
    name: mediassist-ai-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_BASE_URL
        fromService:
          type: static
          name: mediassist-ai-web
          property: host

  - type: static
    name: mediassist-ai-web
    rootDir: frontend
    buildCommand: npm ci && VITE_API_BASE_URL="https://${API_HOST}/api/v1" npm run build
    staticPublishPath: dist
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: mediassist-ai-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

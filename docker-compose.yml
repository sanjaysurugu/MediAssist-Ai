version: '3.8'

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: mediassist_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-mediassist_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mediassist_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediassist_backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    environment:
      POSTGRES_SERVER: postgres_db
    depends_on:
      postgres_db:
        condition: service_healthy
    command: >
      sh -c "python init_db.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
